# NexoTienda · nginx
#
# Un solo bloque atiende el dominio y TODOS los subdominios: cada comercio es
# {slug}.nexotienda.app y cada pueblo {pueblo}.nexotienda.app. La app decide cuál
# es cuál leyendo el Host, así que el `proxy_set_header Host $host` de abajo no es
# decorativo: sin eso, todas las tiendas se ven iguales.
#
# El bloque HTTPS lo agrega certbot. Ver deploy/README.md por el certificado.

server {
    listen 80;
    listen [::]:80;
    server_name nexotienda.app *.nexotienda.app;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los assets de Next llevan hash en el nombre: se pueden cachear para siempre.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    client_max_body_size 10m;
}
