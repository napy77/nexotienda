# NexoTienda · nginx CON el certificado comodín ya emitido.
#
# `certbot certonly` emite el certificado pero NO toca nginx, así que esta config
# se instala a mano una vez:
#   cp deploy/nginx-nexotienda-ssl.conf /etc/nginx/sites-available/nexotienda
#   nginx -t && systemctl reload nginx
#
# Ningún script la pisa después.

server {
    listen 80;
    listen [::]:80;
    server_name nexotienda.app *.nexotienda.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # El comodín cubre todos los comercios y todos los pueblos, presentes y futuros.
    # Un comercio nuevo no necesita ni DNS ni certificado: publica y anda.
    server_name nexotienda.app *.nexotienda.app;

    ssl_certificate     /etc/letsencrypt/live/nexotienda.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexotienda.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        # La app decide qué comercio es leyendo el Host. Sin esto, todas las
        # tiendas se ven iguales.
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    client_max_body_size 10m;
}
